name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: |
          gofmt -w .
          git diff --exit-code
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  race-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: tools/requirements-schema.txt
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check -r tools/requirements-schema.txt
      - name: Validate JSON contracts
        run: python tools/validate_contracts.py
      - name: Test offline corpus tools
        run: python -B -m unittest discover -s tools -p 'test_*.py'
      - name: Race detector
        run: go test -race ./...
      - name: Fuzz byte cursor
        run: go test ./internal/cursor -run=^$ -fuzz=FuzzByteReader -fuzztime=30s
      - name: Fuzz bit cursor
        run: go test ./internal/cursor -run=^$ -fuzz=FuzzBitReader -fuzztime=30s
      - name: Fuzz AMF0
        run: go test ./internal/amf0 -run=^$ -fuzz=FuzzAMF0 -fuzztime=30s
      - name: Fuzz AAC AudioSpecificConfig
        run: go test ./internal/aac -run=^$ -fuzz=FuzzAudioSpecificConfig -fuzztime=30s
      - name: Fuzz MPEG Audio frame header
        run: go test ./internal/mp3 -run=^$ -fuzz=FuzzFrameHeader -fuzztime=30s
      - name: Fuzz AVCDecoderConfigurationRecord
        run: go test ./internal/avc -run=^$ -fuzz=FuzzDecoderConfigurationRecord -fuzztime=30s
      - name: Fuzz AVC length-prefixed NAL units
        run: go test ./internal/avc -run=^$ -fuzz=FuzzLengthPrefixedNALUnits -fuzztime=30s
      - name: Fuzz FLV header
        run: go test ./internal/flv -run=^$ -fuzz=FuzzFLVHeader -fuzztime=30s
      - name: Fuzz FLV tag
        run: go test ./internal/flv -run=^$ -fuzz=FuzzTag -fuzztime=30s
      - name: Fuzz chunked scan and tag pages
        run: go test ./internal/flv -run=^$ -fuzz=FuzzScanContextPage -fuzztime=30s
      - name: Fuzz scan progress equivalence
        run: go test ./internal/flv -run=^$ -fuzz=FuzzScanProgress -fuzztime=30s
      - name: Fuzz desktop exact page starts
        run: go test ./internal/desktop -run=^$ -fuzz=FuzzPageStart -fuzztime=30s
      - name: Fuzz FLV AAC detail
        run: go test ./internal/flv -run=^$ -fuzz=FuzzAACAudio -fuzztime=30s
      - name: Fuzz FLV MP3 detail
        run: go test ./internal/flv -run=^$ -fuzz=FuzzMP3Audio -fuzztime=30s
      - name: Fuzz FLV AVC detail
        run: go test ./internal/flv -run=^$ -fuzz=FuzzAVCVideo -fuzztime=30s
      - name: Fuzz cross-tag media analysis
        run: go test ./internal/analysis -run=^$ -fuzz=FuzzAnalyzeTag -fuzztime=30s
      - name: Fuzz MP3 cross-tag media analysis v2
        run: go test ./internal/analysis -run=^$ -fuzz=FuzzAnalyzeV2 -fuzztime=30s

  desktop-windows:
    name: Desktop Windows (non-GUI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install desktop frontend dependencies
        working-directory: desktop/frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: desktop/frontend
        run: npm test
      - name: Build desktop frontend assets
        working-directory: desktop/frontend
        run: npm run build
      - name: Synthetic host contract tests (no browser)
        working-directory: desktop/frontend
        run: node --test test/browser-filter-fixture.test.mjs test/browser-trend-fixture.test.mjs
      - name: Desktop module tests
        working-directory: desktop
        run: go test ./...
      - name: Desktop module vet
        working-directory: desktop
        run: go vet ./...
      - name: Desktop race detector when gcc is available
        working-directory: desktop
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $env:CGO_ENABLED = '1'
            go test -race ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output '::notice::Desktop race check skipped because gcc is unavailable on this runner.'
          }
      - name: Deterministic native fixture tests
        run: python -B -m unittest discover -s tools/desktop-native -p '*fixtures_test.py' -v
      - name: Native gate self-tests (PowerShell 7, no GUI)
        shell: pwsh
        run: |
          & ./tools/desktop-native/self-test.ps1
          & ./tools/desktop-native/summary-recovery-self-test.ps1
      - name: Native gate self-tests (Windows PowerShell 5.1, no GUI)
        shell: powershell
        run: |
          & ./tools/desktop-native/self-test.ps1
          & ./tools/desktop-native/summary-recovery-self-test.ps1
