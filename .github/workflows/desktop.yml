name: Desktop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-shell:
    name: Desktop Windows tests and production build (non-GUI)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install reviewed Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Generate and verify bindings
        run: |
          wails generate module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- frontend/wailsjs/go go.mod go.sum
      - name: Install frontend
        run: npm ci --no-audit --no-fund
        working-directory: desktop/frontend
      - name: Frontend tests
        run: npm test
        working-directory: desktop/frontend
      - name: Type-check and build frontend
        run: npm run build
        working-directory: desktop/frontend
      - name: Synthetic host contract tests (no browser)
        run: node --test test/browser-filter-fixture.test.mjs test/browser-trend-fixture.test.mjs test/browser-save-fixture.test.mjs
        working-directory: desktop/frontend
      - name: Host tests and vet
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Desktop race detector when gcc is available
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $env:CGO_ENABLED = '1'
            go test -race -count=1 ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output '::notice::Desktop race check skipped because gcc is unavailable on this runner.'
          }
      - name: Windows picker process prototype tests (no GUI)
        run: |
          go test -tags pickerprocess -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags pickerprocess ./...
      - name: Deterministic native fixture tests
        working-directory: .
        run: python -B -m unittest discover -s tools/desktop-native -p '*fixtures_test.py' -v
      - name: Native save overlay generator tests (no build or GUI)
        working-directory: .
        run: python -B -m unittest discover -s tools/desktop-native -p '*_build_test.py' -v
      - name: Install snapshot validator dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check -r tools/requirements-schema.txt
      - name: Native evidence tool tests (no media generation or GUI)
        working-directory: tools/desktop-native
        run: python -B -m unittest long_media_test resource_probe_test handle_probe_test snapshot_check_test scan_compare_test resource_cycles_test -v
      - name: Native gate self-tests (PowerShell 7, no GUI)
        working-directory: .
        shell: pwsh
        run: |
          & ./tools/desktop-native/self-test.ps1
          & ./tools/desktop-native/summary-recovery-self-test.ps1
      - name: Native gate self-tests (Windows PowerShell 5.1, no GUI)
        working-directory: .
        shell: powershell
        run: |
          & ./tools/desktop-native/self-test.ps1
          & ./tools/desktop-native/summary-recovery-self-test.ps1
      - name: Production Windows build (no installer)
        run: ./build-production.ps1

  linux-shell:
    name: Desktop Linux tests, production build and codec regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      GOTOOLCHAIN: go1.27.0
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dbus-x11 xvfb xauth libglib2.0-bin at-spi2-core python3-pyatspi python3-xlib python3-jsonschema ffmpeg
      - name: Production Linux build (no package)
        run: ./build-production.sh
      - name: Verify production bindings and module files
        run: git diff --exit-code -- frontend/wailsjs/go go.mod go.sum
      - name: Frontend tests
        run: npm test
        working-directory: desktop/frontend
      - name: Host race tests and vet
        run: |
          go test -race -tags webkit2_41 -count=1 ./...
          go vet -tags webkit2_41 ./...
      - name: Linux smoke and snapshot helper tests
        working-directory: tools/desktop-native
        run: /usr/bin/python3 -B -m unittest linux_smoke_test snapshot_check_test -v
      - name: Codec regression tool tests
        working-directory: .
        run: /usr/bin/python3 -B -m unittest discover -s tools/codec-regression -p '*_test.py' -v
      - name: Generate codec inputs and independent FFmpeg expectations
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/generate.py --output-dir "$PWD/.cache/linux-codec-regression/samples"
      - name: Codec CLI contracts and source-bit comparisons
        working-directory: .
        run: |
          go build -o "$PWD/.cache/linux-codec-regression/muxray" ./cmd/muxray
          /usr/bin/python3 -B tools/codec-regression/verify.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --cli "$PWD/.cache/linux-codec-regression/muxray" --output-dir "$PWD/.cache/linux-codec-regression/cli"
          /usr/bin/python3 -B tools/codec-regression/verify_v3.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --cli "$PWD/.cache/linux-codec-regression/muxray" --output-dir "$PWD/.cache/linux-codec-regression/cli-v3"
      - name: Six native GTK and WebKit codec cases in private Xvfb
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/native.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/linux-codec-regression/native"
      - name: PPS and B-frame multi-slice native source-bit checks
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/native_v3.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/linux-codec-regression/native-v3"
      - name: Generate MP3 side-info corpus and independent source-bit oracle
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/side_info_oracle.py --output-dir "$PWD/.cache/linux-codec-regression/side-info-samples"
      - name: MP3 v3 fields, dependency facts and v1/v2 compatibility
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/verify_side_info.py --input-dir "$PWD/.cache/linux-codec-regression/side-info-samples" --cli "$PWD/.cache/linux-codec-regression/muxray" --output-dir "$PWD/.cache/linux-codec-regression/cli-side-info"
      - name: Native MP3 side-info and long AVC context continuation
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/native_context_side.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --side-info-dir "$PWD/.cache/linux-codec-regression/side-info-samples" --binary "$PWD/desktop/build/bin/MuxRay" --timeout-seconds 420 --output-dir "$PWD/.cache/linux-codec-regression/native-context-side"
      - name: Native MP3 frame browsing, H264 evidence and snapshot v2 curves
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/native_browse_evidence.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --side-info-dir "$PWD/.cache/linux-codec-regression/side-info-samples" --binary "$PWD/desktop/build/bin/MuxRay" --cli "$PWD/.cache/linux-codec-regression/muxray" --output-dir "$PWD/.cache/linux-codec-regression/native-browse-evidence"
      - name: Preserve codec regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-codec-regression
          path: |
            .cache/linux-codec-regression/**/*.json
            .cache/linux-codec-regression/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore

  linux-search-history:
    name: Desktop Linux H.264 search and MP3 dependency native regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.27.0
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Prepare independent regression evidence
        run: |
          mkdir -p .cache/sh-ci
          git rev-parse HEAD > .cache/sh-ci/source-revision.log
      - name: Install Linux desktop and native regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dbus-x11 xvfb xauth libglib2.0-bin at-spi2-core python3-pyatspi python3-xlib python3-jsonschema ffmpeg
      - name: Build and identify the production binary
        run: |
          ./desktop/build-production.sh 2>&1 | tee .cache/sh-ci/production-build.log
          git diff --exit-code -- desktop/frontend/wailsjs/go desktop/go.mod desktop/go.sum
          sha256sum desktop/build/bin/MuxRay > .cache/sh-ci/binary.sha256
      - name: Search and dependency regression helper tests
        working-directory: tools/codec-regression
        run: /usr/bin/python3 -B -m unittest search_history_oracle_test native_search_history_test -v 2>&1 | tee ../../.cache/sh-ci/tool-tests.log
      - name: Generate independent search and dependency expectations
        run: /usr/bin/python3 -B tools/codec-regression/search_history_oracle.py --output-dir "$PWD/.cache/sh-ci/samples" 2>&1 | tee .cache/sh-ci/generation.log
      - name: Nine native search and dependency rounds in private Xvfb
        run: /usr/bin/python3 -B tools/codec-regression/native_search_history.py --input-dir "$PWD/.cache/sh-ci/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/sh-ci/native" --timeout-seconds 420 2>&1 | tee .cache/sh-ci/native.log
      - name: Verify the tested binary is unchanged
        if: always()
        run: |
          if [[ -f .cache/sh-ci/binary.sha256 ]]; then
            sha256sum --check .cache/sh-ci/binary.sha256 2>&1 | tee .cache/sh-ci/binary-check.log
          fi
      - name: Preserve search and dependency regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-search-history-regression
          path: |
            .cache/sh-ci/**/*.json
            .cache/sh-ci/**/*.log
            .cache/sh-ci/*.sha256
          include-hidden-files: true
          if-no-files-found: ignore

  linux-full-codec:
    name: Desktop Linux full codec headers, MP3 pages and SEI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.27.0
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Prepare independent regression evidence
        run: |
          mkdir -p .cache/fc-ci
          git rev-parse HEAD > .cache/fc-ci/source-revision.log
      - name: Install desktop and native regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dbus-x11 xvfb xauth libglib2.0-bin at-spi2-core python3-pyatspi python3-xlib python3-jsonschema ffmpeg
      - name: Build and identify production binaries
        run: |
          ./desktop/build-production.sh 2>&1 | tee .cache/fc-ci/production-build.log
          git diff --exit-code -- desktop/frontend/wailsjs/go desktop/go.mod desktop/go.sum
          go build -trimpath -o .cache/fc-ci/muxray ./cmd/muxray
          sha256sum desktop/build/bin/MuxRay .cache/fc-ci/muxray > .cache/fc-ci/binaries.sha256
      - name: Test independent codec regression tools
        run: /usr/bin/python3 -B -m unittest discover -s tools/codec-regression -p '*_test.py' -v 2>&1 | tee .cache/fc-ci/tool-tests.log
      - name: Generate source-derived complete header and frame expectations
        run: /usr/bin/python3 -B tools/codec-regression/full_codec_oracle.py --output-dir "$PWD/.cache/fc-ci/samples" 2>&1 | tee .cache/fc-ci/generation.log
      - name: Validate full CLI contracts, values and source bits
        run: /usr/bin/python3 -B tools/codec-regression/verify_full_codec.py --input-dir "$PWD/.cache/fc-ci/samples" --cli "$PWD/.cache/fc-ci/muxray" --output-dir "$PWD/.cache/fc-ci/cli" 2>&1 | tee .cache/fc-ci/cli.log
      - name: Native full H264 syntax and tail source links
        run: /usr/bin/python3 -B tools/codec-regression/native_full_h264.py --input-dir "$PWD/.cache/fc-ci/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/fc-ci/h264" --timeout-seconds 240 2>&1 | tee .cache/fc-ci/h264.log
      - name: Native all-frame MP3 summary, retained pages and source links
        run: /usr/bin/python3 -B tools/codec-regression/native_full_summary.py --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/fc-ci/mp3" --timeout-seconds 420 2>&1 | tee .cache/fc-ci/mp3.log
      - name: Generate independent MP3 page and SEI expectations
        run: /usr/bin/python3 -B tools/codec-regression/paged_codec_oracle.py --output-dir "$PWD/.cache/fc-ci/ps-samples" 2>&1 | tee .cache/fc-ci/ps-generation.log
      - name: Validate SEI v5 and legacy CLI contracts
        run: /usr/bin/python3 -B tools/codec-regression/verify_paged_codec.py --input-dir "$PWD/.cache/fc-ci/ps-samples" --cli "$PWD/.cache/fc-ci/muxray" --output-dir "$PWD/.cache/fc-ci/ps-cli" 2>&1 | tee .cache/fc-ci/ps-cli.log
      - name: Eight native MP3 page, summary-link and SEI source rounds
        run: /usr/bin/python3 -B tools/codec-regression/native_paged_codec.py --input-dir "$PWD/.cache/fc-ci/ps-samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/fc-ci/ps" --timeout-seconds 1800 2>&1 | tee .cache/fc-ci/ps-native.log
      - name: Verify binaries unchanged
        if: always()
        run: |
          if [[ -f .cache/fc-ci/binaries.sha256 ]]; then
            sha256sum --check .cache/fc-ci/binaries.sha256 2>&1 | tee .cache/fc-ci/binary-check.log
          fi
      - name: Preserve full codec evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-full-codec-regression
          path: |
            .cache/fc-ci/**/*.json
            .cache/fc-ci/**/*.log
            .cache/fc-ci/*.sha256
          include-hidden-files: true
          if-no-files-found: ignore

  linux-timing-navigation:
    name: Desktop Linux direct MP3 and SEI timing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.27.0
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install desktop regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dbus-x11 xvfb xauth libglib2.0-bin at-spi2-core python3-pyatspi python3-xlib python3-jsonschema ffmpeg
      - name: Build current and frozen baseline CLI
        run: |
          mkdir -p .cache/tn-ci "$RUNNER_TEMP/muxray-timing-baseline"
          git rev-parse HEAD > .cache/tn-ci/source-revision.log
          baseline_commit=$(/usr/bin/python3 -B tools/codec-regression/check_timing_baseline.py --output .cache/tn-ci/baseline.json --print-commit)
          git archive "$baseline_commit" | tar -x -C "$RUNNER_TEMP/muxray-timing-baseline"
          go -C "$RUNNER_TEMP/muxray-timing-baseline" build -trimpath -o "$PWD/.cache/tn-ci/baseline-cli" ./cmd/muxray
          go build -trimpath -o .cache/tn-ci/muxray ./cmd/muxray
          ./desktop/build-production.sh 2>&1 | tee .cache/tn-ci/build.log
          git diff --exit-code -- desktop/frontend/wailsjs/go desktop/go.mod desktop/go.sum
          sha256sum desktop/build/bin/MuxRay .cache/tn-ci/muxray .cache/tn-ci/baseline-cli > .cache/tn-ci/binaries.sha256
      - name: Test independent regression helpers
        run: /usr/bin/python3 -B -m unittest discover -s tools/codec-regression -p '*_test.py' -v 2>&1 | tee .cache/tn-ci/tool-tests.log
      - name: Generate and verify independent timing evidence
        run: |
          /usr/bin/python3 -B tools/codec-regression/timing_navigation_oracle.py --output-dir "$PWD/.cache/tn-ci/samples" 2>&1 | tee .cache/tn-ci/generate.log
          /usr/bin/python3 -B tools/codec-regression/verify_timing_navigation.py --input-dir "$PWD/.cache/tn-ci/samples" --cli "$PWD/.cache/tn-ci/muxray" --baseline-cli "$PWD/.cache/tn-ci/baseline-cli" --output-dir "$PWD/.cache/tn-ci/cli" 2>&1 | tee .cache/tn-ci/cli.log
      - name: Record parse and checkpoint performance
        run: /usr/bin/python3 -B tools/codec-regression/performance_baseline.py --output-dir "$PWD/.cache/tn-ci/performance" 2>&1 | tee .cache/tn-ci/performance.log
      - name: Native direct navigation and contextual timing
        run: /usr/bin/python3 -B tools/codec-regression/native_timing_navigation.py --input-dir "$PWD/.cache/tn-ci/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/tn-ci/native" --timeout-seconds 900 2>&1 | tee .cache/tn-ci/native.log
      - name: Verify binaries unchanged
        if: always()
        run: |
          if [[ -f .cache/tn-ci/binaries.sha256 ]]; then
            sha256sum --check .cache/tn-ci/binaries.sha256 > .cache/tn-ci/binary-check.log
          fi
      - name: Preserve timing and navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-timing-navigation-regression
          path: |
            .cache/tn-ci/**/*.json
            .cache/tn-ci/**/*.log
            .cache/tn-ci/*.sha256
          include-hidden-files: true
          if-no-files-found: ignore

  linux-codec-search:
    name: Desktop Linux MP3 changes and SEI message search
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.27.0
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install desktop regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dbus-x11 xvfb xauth libglib2.0-bin at-spi2-core python3-pyatspi python3-xlib python3-jsonschema ffmpeg
      - name: Build and identify production binary
        run: |
          mkdir -p .cache/cs-ci
          git rev-parse HEAD > .cache/cs-ci/source-revision.log
          ./desktop/build-production.sh 2>&1 | tee .cache/cs-ci/build.log
          git diff --exit-code -- desktop/frontend/wailsjs/go desktop/go.mod desktop/go.sum
          sha256sum desktop/build/bin/MuxRay > .cache/cs-ci/binary.sha256
      - name: Search lifecycle and independent helper tests
        run: |
          go test -race ./internal/mp3search ./internal/seisearch ./internal/document ./internal/desktop 2>&1 | tee .cache/cs-ci/go-tests.log
          /usr/bin/python3 -B -m unittest discover -s tools/codec-regression -p '*_test.py' -v 2>&1 | tee .cache/cs-ci/codec-tools.log
          /usr/bin/python3 -B -m unittest discover -s tools/desktop-native -p '*_test.py' -v 2>&1 | tee .cache/cs-ci/native-tools.log
      - name: Record oracle byte-window performance
        run: /usr/bin/python3 -B tools/codec-regression/source_field_benchmark.py --repetitions 1 > .cache/cs-ci/oracle-benchmark.json
      - name: Generate authored codec-search evidence
        run: /usr/bin/python3 -B tools/codec-regression/codec_search_oracle.py --output-dir "$PWD/.cache/cs-ci/samples" 2>&1 | tee .cache/cs-ci/generate.log
      - name: Six native codec-search and source-navigation rounds
        run: /usr/bin/python3 -B tools/codec-regression/native_codec_search.py --input-dir "$PWD/.cache/cs-ci/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/cs-ci/native" --timeout-seconds 900 2>&1 | tee .cache/cs-ci/native.log
      - name: Verify tested binary unchanged
        if: always()
        run: |
          if [[ -f .cache/cs-ci/binary.sha256 ]]; then
            sha256sum --check .cache/cs-ci/binary.sha256 > .cache/cs-ci/binary-check.log
          fi
      - name: Preserve codec-search and close-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-codec-search-regression
          path: |
            .cache/cs-ci/**/*.json
            .cache/cs-ci/**/*.log
            .cache/cs-ci/*.sha256
          include-hidden-files: true
          if-no-files-found: ignore
