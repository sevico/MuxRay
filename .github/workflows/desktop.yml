name: Desktop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-shell:
    name: Desktop Windows tests and production build (non-GUI)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install reviewed Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Generate and verify bindings
        run: |
          wails generate module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- frontend/wailsjs/go go.mod go.sum
      - name: Install frontend
        run: npm ci --no-audit --no-fund
        working-directory: desktop/frontend
      - name: Frontend tests
        run: npm test
        working-directory: desktop/frontend
      - name: Type-check and build frontend
        run: npm run build
        working-directory: desktop/frontend
      - name: Synthetic host contract tests (no browser)
        run: node --test test/browser-filter-fixture.test.mjs test/browser-trend-fixture.test.mjs test/browser-save-fixture.test.mjs
        working-directory: desktop/frontend
      - name: Host tests and vet
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
      - name: Desktop race detector when gcc is available
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $env:CGO_ENABLED = '1'
            go test -race -count=1 ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output '::notice::Desktop race check skipped because gcc is unavailable on this runner.'
          }
      - name: Windows picker process prototype tests (no GUI)
        run: |
          go test -tags pickerprocess -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -tags pickerprocess ./...
      - name: Deterministic native fixture tests
        working-directory: .
        run: python -B -m unittest discover -s tools/desktop-native -p '*fixtures_test.py' -v
      - name: Native save overlay generator tests (no build or GUI)
        working-directory: .
        run: python -B -m unittest discover -s tools/desktop-native -p '*_build_test.py' -v
      - name: Install snapshot validator dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check -r tools/requirements-schema.txt
      - name: Native evidence tool tests (no media generation or GUI)
        working-directory: tools/desktop-native
        run: python -B -m unittest long_media_test resource_probe_test handle_probe_test snapshot_check_test scan_compare_test resource_cycles_test -v
      - name: Native gate self-tests (PowerShell 7, no GUI)
        working-directory: .
        shell: pwsh
        run: |
          & ./tools/desktop-native/self-test.ps1
          & ./tools/desktop-native/summary-recovery-self-test.ps1
      - name: Native gate self-tests (Windows PowerShell 5.1, no GUI)
        working-directory: .
        shell: powershell
        run: |
          & ./tools/desktop-native/self-test.ps1
          & ./tools/desktop-native/summary-recovery-self-test.ps1
      - name: Production Windows build (no installer)
        run: ./build-production.ps1

  linux-shell:
    name: Desktop Linux tests, production build and codec regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      GOTOOLCHAIN: go1.27.0
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dbus-x11 xvfb xauth libglib2.0-bin at-spi2-core python3-pyatspi python3-xlib python3-jsonschema ffmpeg
      - name: Production Linux build (no package)
        run: ./build-production.sh
      - name: Verify production bindings and module files
        run: git diff --exit-code -- frontend/wailsjs/go go.mod go.sum
      - name: Frontend tests
        run: npm test
        working-directory: desktop/frontend
      - name: Host race tests and vet
        run: |
          go test -race -tags webkit2_41 -count=1 ./...
          go vet -tags webkit2_41 ./...
      - name: Linux smoke helper tests
        working-directory: .
        run: /usr/bin/python3 -B -m unittest discover -s tools/desktop-native -p linux_smoke_test.py -v
      - name: Codec regression tool tests
        working-directory: .
        run: /usr/bin/python3 -B -m unittest discover -s tools/codec-regression -p '*_test.py' -v
      - name: Generate codec inputs and independent FFmpeg expectations
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/generate.py --output-dir "$PWD/.cache/linux-codec-regression/samples"
      - name: Codec CLI contracts and source-bit comparisons
        working-directory: .
        run: |
          go build -o "$PWD/.cache/linux-codec-regression/muxray" ./cmd/muxray
          /usr/bin/python3 -B tools/codec-regression/verify.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --cli "$PWD/.cache/linux-codec-regression/muxray" --output-dir "$PWD/.cache/linux-codec-regression/cli"
          /usr/bin/python3 -B tools/codec-regression/verify_v3.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --cli "$PWD/.cache/linux-codec-regression/muxray" --output-dir "$PWD/.cache/linux-codec-regression/cli-v3"
      - name: Six native GTK and WebKit codec cases in private Xvfb
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/native.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/linux-codec-regression/native"
      - name: PPS and B-frame multi-slice native source-bit checks
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/native_v3.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/linux-codec-regression/native-v3"
      - name: Generate MP3 side-info corpus and independent source-bit oracle
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/side_info_oracle.py --output-dir "$PWD/.cache/linux-codec-regression/side-info-samples"
      - name: MP3 v3 fields, dependency facts and v1/v2 compatibility
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/verify_side_info.py --input-dir "$PWD/.cache/linux-codec-regression/side-info-samples" --cli "$PWD/.cache/linux-codec-regression/muxray" --output-dir "$PWD/.cache/linux-codec-regression/cli-side-info"
      - name: Native MP3 side-info and long AVC context continuation
        working-directory: .
        run: /usr/bin/python3 -B tools/codec-regression/native_context_side.py --input-dir "$PWD/.cache/linux-codec-regression/samples" --side-info-dir "$PWD/.cache/linux-codec-regression/side-info-samples" --binary "$PWD/desktop/build/bin/MuxRay" --output-dir "$PWD/.cache/linux-codec-regression/native-context-side"
      - name: Preserve codec regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-codec-regression
          path: |
            .cache/linux-codec-regression/**/*.json
            .cache/linux-codec-regression/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
